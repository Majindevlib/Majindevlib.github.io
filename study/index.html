    { image: "PASTE_IMAGE_URL_HERE", title: "Topic 18", description: "Change this text." }
];

const studyGrid = document.getElementById("studyGrid");

function makeStudyCard(item) {
    const card = document.createElement("article");
    card.className = "study-card";

    const image = document.createElement("img");
    image.className = "study-image";
    image.src = item.image;
    image.alt = item.title;
    image.onerror = function () { this.style.opacity = "0"; };

    const gradient = document.createElement("div");
    gradient.className = "study-gradient";

    const content = document.createElement("div");
    content.className = "study-content";

    const title = document.createElement("h3");
    title.className = "study-name";
    title.textContent = item.title;

    const description = document.createElement("p");
    description.className = "study-description";
    description.textContent = item.description;

    content.appendChild(title);
    content.appendChild(description);

    card.appendChild(image);
    card.appendChild(gradient);
    card.appendChild(content);

    return card;
}

function buildStudyGrid() {
    studyGrid.innerHTML = "";
    studyItems.forEach(item => studyGrid.appendChild(makeStudyCard(item)));
}

buildStudyGrid();

</script>
<script src="/background.js"></script>
