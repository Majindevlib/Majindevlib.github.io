
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAJIN V1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #050608;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }

        /* =========================================================
           NAVIGATION
           ========================================================= */

        .nav {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 20;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;

            background: rgba(16, 18, 22, 0.72);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.35),
                inset 0 1px rgba(255, 255, 255, 0.04);
        }

        .nav-item {
            border: 0;
            outline: 0;

            padding: 10px 16px;

            border-radius: 13px;

            background: transparent;
            color: rgba(255, 255, 255, 0.65);

            font-size: 14px;
            font-weight: 500;

            cursor: pointer;

            transition:
                color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-1px);
        }

        .nav-item.active {
            color: white;
            background: rgba(255, 255, 255, 0.10);
        }

        .version {
            margin-left: 5px;
            padding: 8px 10px;

            color: rgba(255, 255, 255, 0.42);

            font-size: 12px;
            font-weight: 600;
        }

        .profile {
            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;

            color: rgba(255, 255, 255, 0.65);
            background: rgba(255, 255, 255, 0.04);

            font-size: 13px;
        }

        /* =========================================================
           HERO
           ========================================================= */

        .hero {
            position: relative;
            z-index: 5;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 130px 25px 80px;

            pointer-events: none;
        }

        .hero-content {
            width: 100%;
            text-align: center;
        }

        .subtitle {
            margin-top: 150px;

            color: rgba(255, 255, 255, 0.34);

            font-size: 12px;
            letter-spacing: 4px;
            text-transform: lowercase;

            user-select: none;
        }

        /* =========================================================
           FEATURES
           ========================================================= */

        .features {
            width: min(1100px, 92vw);

            margin: 30px auto 0;

            text-align: center;

            pointer-events: auto;
        }

        .features-heading {
            margin-top: 10px;
        }

        .features-title {
            margin: 0;

            font-size: clamp(30px, 5vw, 58px);
            font-weight: 800;
            letter-spacing: -2px;

            color: #ffffff;
        }

        .features-coming {
            margin-top: 4px;

            font-size: clamp(25px, 4vw, 46px);
            font-weight: 800;

            letter-spacing: -1px;

            color: rgba(255, 255, 255, 0.32);
        }

        .feature-grid {
            margin-top: 32px;

            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 16px;
        }

        .feature-card {
            position: relative;

            min-height: 220px;

            overflow: hidden;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;

            background: rgba(13, 15, 20, 0.70);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.28),
                inset 0 1px rgba(255, 255, 255, 0.03);

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .feature-card:hover {
            transform: translateY(-6px);

            border-color:
                rgba(255, 255, 255, 0.17);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.40),
                0 0 30px rgba(255, 255, 255, 0.03);
        }

        .feature-image {
            width: 100%;
            height: 135px;

            object-fit: cover;

            display: block;

            background:
                linear-gradient(
                    135deg,
                    #11151b,
                    #080a0e
                );
        }

        .feature-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    transparent 30%,
                    rgba(0, 0, 0, 0.78) 100%
                );

            pointer-events: none;
        }

        .feature-content {
            position: absolute;

            left: 16px;
            right: 16px;
            bottom: 15px;

            text-align: left;
        }

        .feature-name {
            margin: 0;

            font-size: 16px;
            font-weight: 700;

            color: white;
        }

        .feature-description {
            margin: 5px 0 0;

            font-size: 12px;
            line-height: 1.4;

            color: rgba(255, 255, 255, 0.53);
        }

        /* =========================================================
           BOTTOM HINT
           ========================================================= */

        .hint {
            position: absolute;

            bottom: 26px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            color: rgba(255, 255, 255, 0.20);

            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;

            pointer-events: none;
            user-select: none;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 950px) {

            .feature-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .hero {
                padding-top: 120px;
            }

            .subtitle {
                margin-top: 120px;
            }
        }

        @media (max-width: 650px) {

            .nav {
                width: calc(100% - 24px);
                justify-content: center;
            }

            .nav-item {
                padding: 9px 10px;
                font-size: 11px;
            }

            .version,
            .profile {
                display: none;
            }

            .hero {
                padding-top: 100px;
                padding-bottom: 50px;
            }

            .subtitle {
                margin-top: 90px;
            }

            .feature-grid {
                grid-template-columns: 1fr;
            }

            .feature-card {
                min-height: 240px;
            }

            .hint {
                display: none;
            }
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <!-- =========================================================
         NAVIGATION
         ========================================================= -->

    <nav class="nav">

        <button class="nav-item active">
            Home
        </button>

        <button class="nav-item">
            Study
        </button>

        <button class="nav-item">
            Media
        </button>

        <button class="nav-item">
            More
        </button>

        <div class="version">
            v1.0
        </div>

        <div class="profile">
            ◉
        </div>

    </nav>


    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <main class="hero">

        <div class="hero-content">

            <!-- Small text -->
            <div class="subtitle">
                have fun ;)
            </div>


            <!-- Features heading -->

            <section class="features">

                <div class="features-heading">

                    <h2 class="features-title">
                        THINGS WE FEATURE
                    </h2>

                    <div class="features-coming">
                        / IS COMING
                    </div>

                </div>


                <!-- Cards are generated from JavaScript -->

                <div
                    class="feature-grid"
                    id="featureGrid">
                </div>

            </section>

        </div>

    </main>


    <div class="hint">
        move your mouse
    </div>


    <script>

        /* =========================================================
           FEATURE CARDS
           =========================================================

           CHANGE YOUR CARDS HERE.

           image:
             Paste an IMAGE URL between the quotes.

           title:
             Changes the card title.

           description:
             Changes the smaller text.

           Example:

           {
               image: "https://example.com/image.png",
               title: "Something",
               description: "Your description."
           }

           ========================================================= */

        const features = [

            {
                image: "PASTE_IMAGE_URL_HERE",
                title: "Feature One",
                description: "Change this text."
            },

            {
                image: "PASTE_IMAGE_URL_HERE",
                title: "Feature Two",
                description: "Change this text."
            },

            {
                image: "PASTE_IMAGE_URL_HERE",
                title: "Feature Three",
                description: "Change this text."
            },

            {
                image: "PASTE_IMAGE_URL_HERE",
                title: "Feature Four",
                description: "Change this text."
            }

        ];


        /* =========================================================
           GENERATE FEATURE CARDS
           ========================================================= */

        const featureGrid =
            document.getElementById(
                "featureGrid"
            );

        features.forEach(
            (feature) => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "feature-card";

                card.innerHTML = `

                    <img
                        class="feature-image"
                        src="${feature.image}"
                        alt="${feature.title}"
                        onerror="
                            this.style.display='none';
                        "
                    >

                    <div
                        class="feature-overlay">
                    </div>

                    <div
                        class="feature-content">

                        <h3
                            class="feature-name">
                            ${feature.title}
                        </h3>

                        <p
                            class="feature-description">
                            ${feature.description}
                        </p>

                    </div>
                `;

                featureGrid.appendChild(
                    card
                );
            }
        );


        /* =========================================================
           PARTICLE CANVAS
           ========================================================= */

        const canvas =
            document.getElementById(
                "canvas"
            );

        const ctx =
            canvas.getContext(
                "2d"
            );

        let width = 0;
        let height = 0;

        const mouse = {
            x: -1000,
            y: -1000,
            active: false
        };


        /* =========================================================
           PARTICLE SETTINGS
           ========================================================= */

        const PARTICLE_SPACING = 5;

        // Smaller value = tighter mouse interaction.
        const MOUSE_RADIUS = 78;

        const MOUSE_FORCE = 18;

        const SPRING = 0.085;

        const DAMPING = 0.82;

        const STAR_COUNT = 260;

        const STAR_SPEED = 1.8;


        let particles = [];

        let stars = [];


        const textCanvas =
            document.createElement(
                "canvas"
            );

        const textCtx =
            textCanvas.getContext(
                "2d"
            );


        /* =========================================================
           CREATE MAJIN V1 PARTICLES
           ========================================================= */

        function createTextParticles() {

            particles = [];

            const tempWidth =
                Math.min(
                    width * 0.90,
                    1500
                );

            const tempHeight =
                Math.min(
                    height * 0.45,
                    500
                );

            textCanvas.width =
                tempWidth;

            textCanvas.height =
                tempHeight;

            textCtx.clearRect(
                0,
                0,
                tempWidth,
                tempHeight
            );

            let fontSize =
                Math.min(
                    tempWidth * 0.18,
                    tempHeight * 0.60
                );

            textCtx.font =
                `900 ${fontSize}px Arial, Helvetica, sans-serif`;

            textCtx.textAlign =
                "center";

            textCtx.textBaseline =
                "middle";

            textCtx.fillStyle =
                "#ffffff";

            textCtx.fillText(
                "MAJIN V1",
                tempWidth / 2,
                tempHeight / 2
            );

            const image =
                textCtx.getImageData(
                    0,
                    0,
                    tempWidth,
                    tempHeight
                );

            const data =
                image.data;

            const offsetX =
                (width - tempWidth) / 2;

            const offsetY =
                (height - tempHeight) / 2 - 20;

            for (
                let y = 0;
                y < tempHeight;
                y += PARTICLE_SPACING
            ) {

                for (
                    let x = 0;
                    x < tempWidth;
                    x += PARTICLE_SPACING
                ) {

                    const index =
                        (y * tempWidth + x) * 4;

                    const alpha =
                        data[index + 3];

                    if (alpha > 140) {

                        particles.push({

                            x:
                                offsetX + x,

                            y:
                                offsetY + y,

                            homeX:
                                offsetX + x,

                            homeY:
                                offsetY + y,

                            vx: 0,
                            vy: 0,

                            size:
                                Math.random() * 1.2 + 1.6,

                            alpha:
                                Math.random() * 0.25 + 0.75

                        });
                    }
                }
            }
        }


        /* =========================================================
           CREATE STARS
           ========================================================= */

        function createStars() {

            stars = [];

            for (
                let i = 0;
                i < STAR_COUNT;
                i++
            ) {

                stars.push({

                    x:
                        Math.random() * width,

                    y:
                        Math.random() * height,

                    length:
                        Math.random() * 35 + 8,

                    speed:
                        Math.random() * STAR_SPEED + 0.25,

                    alpha:
                        Math.random() * 0.55 + 0.10,

                    width:
                        Math.random() * 1.2 + 0.2

                });
            }
        }


        /* =========================================================
           RESIZE
           ========================================================= */

        function resize() {

            width =
                window.innerWidth;

            height =
                window.innerHeight;

            const pixelRatio =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

            canvas.width =
                width * pixelRatio;

            canvas.height =
                height * pixelRatio;

            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";

            ctx.setTransform(
                pixelRatio,
                0,
                0,
                pixelRatio,
                0,
                0
            );

            createStars();
            createTextParticles();
        }

        window.addEventListener(
            "resize",
            resize
        );


        /* =========================================================
           MOUSE
           ========================================================= */

        window.addEventListener(
            "mousemove",
            (event) => {

                mouse.x =
                    event.clientX;

                mouse.y =
                    event.clientY;

                mouse.active =
                    true;
            }
        );

        window.addEventListener(
            "mouseleave",
            () => {

                mouse.active =
                    false;

                mouse.x =
                    -1000;

                mouse.y =
                    -1000;
            }
        );


        /* =========================================================
           UPDATE PARTICLES
           ========================================================= */

        function updateParticle(
            particle
        ) {

            const springX =
                (
                    particle.homeX -
                    particle.x
                ) *
                SPRING;

            const springY =
                (
                    particle.homeY -
                    particle.y
                ) *
                SPRING;

            particle.vx +=
                springX;

            particle.vy +=
                springY;


            if (
                mouse.active
            ) {

                const dx =
                    particle.x -
                    mouse.x;

                const dy =
                    particle.y -
                    mouse.y;

                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );

                if (
                    distance > 0 &&
                    distance < MOUSE_RADIUS
                ) {

                    const nx =
                        dx /
                        distance;

                    const ny =
                        dy /
                        distance;

                    const influence =
                        1 -
                        distance /
                        MOUSE_RADIUS;

                    const force =
                        MOUSE_FORCE *
                        influence *
                        influence;

                    particle.vx +=
                        nx *
                        force;

                    particle.vy +=
                        ny *
                        force;
                }
            }


            particle.vx *=
                DAMPING;

            particle.vy *=
                DAMPING;


            particle.x +=
                particle.vx;

            particle.y +=
                particle.vy;
        }


        /* =========================================================
           DRAW STARS
           ========================================================= */

        function drawStars() {

            for (
                const star of stars
            ) {

                star.x +=
                    star.speed;

                if (
                    star.x >
                    width + 100
                ) {

                    star.x =
                        -100;

                    star.y =
                        Math.random() *
                        height;
                }


                const gradient =
                    ctx.createLinearGradient(
                        star.x,
                        star.y,
                        star.x -
                            star.length,
                        star.y -
                            star.length *
                            0.12
                    );

                gradient.addColorStop(
                    0,
                    `rgba(
                        255,
                        255,
                        255,
                        ${star.alpha}
                    )`
                );

                gradient.addColorStop(
                    1,
                    "rgba(255,255,255,0)"
                );

                ctx.strokeStyle =
                    gradient;

                ctx.lineWidth =
                    star.width;

                ctx.beginPath();

                ctx.moveTo(
                    star.x,
                    star.y
                );

                ctx.lineTo(
                    star.x -
                        star.length,
                    star.y -
                        star.length *
                        0.12
                );

                ctx.stroke();
            }
        }


        /* =========================================================
           DRAW PARTICLES
           ========================================================= */

        function drawParticles() {

            for (
                const particle of particles
            ) {

                let glow = 0;

                if (
                    mouse.active
                ) {

                    const dx =
                        particle.x -
                        mouse.x;

                    const dy =
                        particle.y -
                        mouse.y;

                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );

                    if (
                        distance <
                        MOUSE_RADIUS
                    ) {

                        glow =
                            1 -
                            distance /
                            MOUSE_RADIUS;
                    }
                }


                const brightness =
                    0.75 +
                    glow * 0.25;


                ctx.fillStyle =
                    `rgba(
                        255,
                        255,
                        255,
                        ${particle.alpha *
                          brightness}
                    )`;


                ctx.beginPath();

                ctx.arc(
                    particle.x,
                    particle.y,
                    particle.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        }


        /* =========================================================
           ANIMATION
           ========================================================= */

        function animate() {

            ctx.fillStyle =
                "#050608";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            const glow =
                ctx.createRadialGradient(
                    width / 2,
                    height / 2,
                    30,
                    width / 2,
                    height / 2,
                    Math.min(
                        width,
                        height
                    ) * 0.55
                );

            glow.addColorStop(
                0,
                "rgba(255,255,255,0.025)"
            );

            glow.addColorStop(
                1,
                "rgba(0,0,0,0)"
            );

            ctx.fillStyle =
                glow;

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            drawStars();


            for (
                const particle of particles
            ) {

                updateParticle(
                    particle
                );
            }


            drawParticles();


            requestAnimationFrame(
                animate
            );
        }


        /* =========================================================
           NAV BUTTONS
           ========================================================= */

        const navItems =
            document.querySelectorAll(
                ".nav-item"
            );

        navItems.forEach(
            (item) => {

                item.addEventListener(
                    "click",
                    () => {

                        navItems.forEach(
                            (nav) => {

                                nav.classList.remove(
                                    "active"
                                );
                            }
                        );

                        item.classList.add(
                            "active"
                        );
                    }
                );
            }
        );


        /* =========================================================
           START
           ========================================================= */

        resize();
        animate();

    </script>

</body>
</html>
