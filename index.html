    <style>

    <!-- =========================================================

    <canvas id="canvas"></canvas>

    <section class="hero">

    <!-- =========================================================

    <section class="feature-section">

            </h2>

        <div class="carousel-window">

    <!-- =========================================================

    <footer class="footer">

    </footer>


    <script>

        /* =========================================================
           FEATURE CARDS
           =========================================================

           CHANGE YOUR CARDS HERE.

           image:
             Paste an image URL.

           title:
             Card title.

           description:
             Small text under the title.

           You can add as many cards as you want.

           ========================================================= */

        const features = [

            {
                image:
                    "PASTE_IMAGE_URL_HERE",

                title:
                    "Feature One",

                description:
                    "Change this text."
            },

            {
                image:
                    "PASTE_IMAGE_URL_HERE",

                title:
                    "Feature Two",

                description:
                    "Change this text."
            },

            {
                image:
                    "PASTE_IMAGE_URL_HERE",

                title:
                    "Feature Three",

                description:
                    "Change this text."
            },

            {
                image:
                    "PASTE_IMAGE_URL_HERE",

                title:
                    "Feature Four",

                description:
                    "Change this text."
            },

            {
                image:
                    "PASTE_IMAGE_URL_HERE",

                title:
                    "Feature Five",

                description:
                    "Change this text."
            },

            {
                image:
                    "PASTE_IMAGE_URL_HERE",

                title:
                    "Feature Six",

                description:
                    "Change this text."
            }

        ];


        /* =========================================================
           CAROUSEL SETTINGS
           ========================================================= */

        const CARD_SPEED = 0.55;

        const CARD_GAP = 18;


        /* =========================================================
           CREATE CARDS
           ========================================================= */

        const track =
            document.getElementById(
                "carouselTrack"
            );


        function createCard(
            feature
        ) {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "feature-card";


            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "feature-image";

            image.src =
                feature.image;

            image.alt =
                feature.title;


            image.onerror =
                function () {

                    this.remove();

                };


            const gradient =
                document.createElement(
                    "div"
                );

            gradient.className =
                "feature-gradient";


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "feature-content";


            const title =
                document.createElement(
                    "h3"
                );

            title.className =
                "feature-name";

            title.textContent =
                feature.title;


            const description =
                document.createElement(
                    "p"
                );

            description.className =
                "feature-description-card";

            description.textContent =
                feature.description;


            content.appendChild(
                title
            );

            content.appendChild(
                description
            );


            card.appendChild(
                image
            );

            card.appendChild(
                gradient
            );

            card.appendChild(
                content
            );


            return card;
        }


        /* =========================================================
           DUPLICATE CARDS
           =========================================================

           The duplicated cards make the track seamless.
        */

        function populateCarousel() {

            track.innerHTML = "";


            const totalSets = 3;


            for (
                let set = 0;
                set < totalSets;
                set++
            ) {

                features.forEach(
                    (
                        feature
                    ) => {

                        track.appendChild(
                            createCard(
                                feature
                            )
                        );

                    }
                );
            }
        }


        populateCarousel();


        /* =========================================================
           CAROUSEL ENGINE
           ========================================================= */

        let trackOffset = 0;


        function getCardWidth() {

            const firstCard =
                track.querySelector(
                    ".feature-card"
                );


            if (
                !firstCard
            ) {
                return 253;
            }


            return (
                firstCard.offsetWidth +
                CARD_GAP
            );
        }


        function animateCarousel() {

            trackOffset -=
                CARD_SPEED;


            const loopWidth =
                features.length *
                getCardWidth();


            /*
                Once the first set has moved completely
                out of view, move it back to the end.

                This makes it feel like an infinite
                stream of cards.
            */

            if (
                Math.abs(
                    trackOffset
                ) >= loopWidth
            ) {

                trackOffset +=
                    loopWidth;
            }


            track.style.transform =
                `translateX(${trackOffset}px)`;


            requestAnimationFrame(
                animateCarousel
            );
        }


        animateCarousel();


        /* =========================================================
           PARTICLE TITLE
           ========================================================= */

        const canvas =
            document.getElementById(
                "canvas"
            );

        const ctx =
            canvas.getContext(
                "2d"
            );


        let width = 0;
        let height = 0;


        const mouse = {

            x: -1000,
            y: -1000,

            active: false

        };


        /* =========================================================
           PARTICLE SETTINGS
           ========================================================= */

        const PARTICLE_SPACING = 5;

        /*
            Smaller = smaller mouse reaction area.
        */

        const MOUSE_RADIUS = 70;


        const MOUSE_FORCE = 18;

        const SPRING = 0.085;

        const DAMPING = 0.82;


        const STAR_COUNT = 260;

        const STAR_SPEED = 1.8;


        let particles = [];

        let stars = [];


        const textCanvas =
            document.createElement(
                "canvas"
            );

        const textCtx =
            textCanvas.getContext(
                "2d"
            );


        /* =========================================================
           TEXT PARTICLES
           ========================================================= */

        function createTextParticles() {

            particles = [];


            const tempWidth =
                Math.min(
                    width * 0.90,
                    1500
                );


            const tempHeight =
                Math.min(
                    height * 0.45,
                    500
                );


            textCanvas.width =
                tempWidth;

            textCanvas.height =
                tempHeight;


            textCtx.clearRect(
                0,
                0,
                tempWidth,
                tempHeight
            );


            let fontSize =
                Math.min(
                    tempWidth * 0.18,
                    tempHeight * 0.60
                );


            textCtx.font =
                `900 ${fontSize}px Arial, Helvetica, sans-serif`;


            textCtx.textAlign =
                "center";


            textCtx.textBaseline =
                "middle";


            textCtx.fillStyle =
                "#ffffff";


            textCtx.fillText(
                "MAJIN V1",
                tempWidth / 2,
                tempHeight / 2
            );


            const image =
                textCtx.getImageData(
                    0,
                    0,
                    tempWidth,
                    tempHeight
                );


            const data =
                image.data;


            const offsetX =
                (width - tempWidth) / 2;


            const offsetY =
                (height - tempHeight) / 2 -
                20;


            for (
                let y = 0;
                y < tempHeight;
                y += PARTICLE_SPACING
            ) {

                for (
                    let x = 0;
                    x < tempWidth;
                    x += PARTICLE_SPACING
                ) {

                    const index =
                        (
                            y *
                            tempWidth +
                            x
                        ) *
                        4;


                    const alpha =
                        data[
                            index +
                            3
                        ];


                    if (
                        alpha > 140
                    ) {

                        particles.push({

                            x:
                                offsetX +
                                x,

                            y:
                                offsetY +
                                y,

                            homeX:
                                offsetX +
                                x,

                            homeY:
                                offsetY +
                                y,

                            vx: 0,

                            vy: 0,

                            size:
                                Math.random() *
                                1.2 +
                                1.6,

                            alpha:
                                Math.random() *
                                0.25 +
                                0.75
                        });
                    }
                }
            }
        }


        /* =========================================================
           STARS
           ========================================================= */

        function createStars() {

            stars = [];


            for (
                let i = 0;
                i < STAR_COUNT;
                i++
            ) {

                stars.push({

                    x:
                        Math.random() *
                        width,

                    y:
                        Math.random() *
                        height,

                    length:
                        Math.random() *
                        35 +
                        8,

                    speed:
                        Math.random() *
                        STAR_SPEED +
                        0.25,

                    alpha:
                        Math.random() *
                        0.55 +
                        0.10,

                    width:
                        Math.random() *
                        1.2 +
                        0.2

                });
            }
        }


        /* =========================================================
           RESIZE
           ========================================================= */

        function resize() {

            width =
                window.innerWidth;


            height =
                window.innerHeight;


            const pixelRatio =
                Math.min(
                    window.devicePixelRatio ||
                    1,
                    2
                );


            canvas.width =
                width *
                pixelRatio;


            canvas.height =
                height *
                pixelRatio;


            canvas.style.width =
                width +
                "px";


            canvas.style.height =
                height +
                "px";


            ctx.setTransform(
                pixelRatio,
                0,
                0,
                pixelRatio,
                0,
                0
            );


            createStars();

            createTextParticles();
        }


        window.addEventListener(
            "resize",
            resize
        );


        /* =========================================================
           MOUSE
           ========================================================= */

        window.addEventListener(
            "mousemove",
            (
                event
            ) => {

                mouse.x =
                    event.clientX;

                mouse.y =
                    event.clientY;

                mouse.active =
                    true;
            }
        );


        window.addEventListener(
            "mouseleave",
            () => {

                mouse.active =
                    false;

                mouse.x =
                    -1000;

                mouse.y =
                    -1000;
            }
        );


        /* =========================================================
           PARTICLE UPDATE
           ========================================================= */

        function updateParticle(
            particle
        ) {

            const springX =
                (
                    particle.homeX -
                    particle.x
                ) *
                SPRING;


            const springY =
                (
                    particle.homeY -
                    particle.y
                ) *
                SPRING;


            particle.vx +=
                springX;


            particle.vy +=
                springY;


            if (
                mouse.active
            ) {

                const dx =
                    particle.x -
                    mouse.x;


                const dy =
                    particle.y -
                    mouse.y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance > 0 &&
                    distance <
                        MOUSE_RADIUS
                ) {

                    const nx =
                        dx /
                        distance;


                    const ny =
                        dy /
                        distance;


                    const influence =
                        1 -
                        distance /
                        MOUSE_RADIUS;


                    const force =
                        MOUSE_FORCE *
                        influence *
                        influence;


                    particle.vx +=
                        nx *
                        force;


                    particle.vy +=
                        ny *
                        force;
                }
            }


            particle.vx *=
                DAMPING;


            particle.vy *=
                DAMPING;


            particle.x +=
                particle.vx;


            particle.y +=
                particle.vy;
        }


        /* =========================================================
           DRAW STARS
           ========================================================= */

        function drawStars() {

            for (
                const star of stars
            ) {

                star.x +=
                    star.speed;


                if (
                    star.x >
                    width + 100
                ) {

                    star.x =
                        -100;


                    star.y =
                        Math.random() *
                        height;
                }


                const gradient =
                    ctx.createLinearGradient(
                        star.x,
                        star.y,
                        star.x -
                            star.length,
                        star.y -
                            star.length *
                            0.12
                    );


                gradient.addColorStop(
                    0,
                    `rgba(
                        255,
                        255,
                        255,
                        ${star.alpha}
                    )`
                );


                gradient.addColorStop(
                    1,
                    "rgba(255,255,255,0)"
                );


                ctx.strokeStyle =
                    gradient;


                ctx.lineWidth =
                    star.width;


                ctx.beginPath();


                ctx.moveTo(
                    star.x,
                    star.y
                );


                ctx.lineTo(
                    star.x -
                        star.length,
                    star.y -
                        star.length *
                        0.12
                );


                ctx.stroke();
            }
        }


        /* =========================================================
           DRAW PARTICLES
           ========================================================= */

        function drawParticles() {

            for (
                const particle of particles
            ) {

                let glow = 0;


                if (
                    mouse.active
                ) {

                    const dx =
                        particle.x -
                        mouse.x;


                    const dy =
                        particle.y -
                        mouse.y;


                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    if (
                        distance <
                        MOUSE_RADIUS
                    ) {

                        glow =
                            1 -
                            distance /
                            MOUSE_RADIUS;
                    }
                }


                const brightness =
                    0.75 +
                    glow *
                    0.25;


                ctx.fillStyle =
                    `rgba(
                        255,
                        255,
                        255,
                        ${
                            particle.alpha *
                            brightness
                        }
                    )`;


                ctx.beginPath();


                ctx.arc(
                    particle.x,
                    particle.y,
                    particle.size,
                    0,
                    Math.PI * 2
                );


                ctx.fill();
            }
        }


        /* =========================================================
           BACKGROUND ANIMATION
           ========================================================= */

        function animate() {

            ctx.fillStyle =
                "#050608";


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            const glow =
                ctx.createRadialGradient(
                    width / 2,
                    height / 2,
                    30,
                    width / 2,
                    height / 2,
                    Math.min(
                        width,
                        height
                    ) *
                    0.55
                );


            glow.addColorStop(
                0,
                "rgba(255,255,255,0.025)"
            );


            glow.addColorStop(
                1,
                "rgba(0,0,0,0)"
            );


            ctx.fillStyle =
                glow;


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            drawStars();


            for (
                const particle of particles
            ) {

                updateParticle(
                    particle
                );
            }


            drawParticles();


            requestAnimationFrame(
                animate
            );
        }


        /* =========================================================
           NAV
           ========================================================= */

        const navItems =
            document.querySelectorAll(
                ".nav-item"
            );


        navItems.forEach(
            (
                item
            ) => {

                item.addEventListener(
                    "click",
                    () => {

                        navItems.forEach(
                            (
                                nav
                            ) => {

                                nav.classList.remove(
                                    "active"
                                );
                            }
                        );


                        item.classList.add(
                            "active"
                        );
                    }
                );
            }
        );


        /* =========================================================
           START
           ========================================================= */

        resize();

        animate();

    </script>

</body>
</html>
